name: zalo_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.1
  image_picker: ^1.2.1
  firebase_storage: ^12.4.10
  firebase_app_check: ^0.3.2+10
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  video_player: ^2.10.0
  flutter_sound: ^9.2.13
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  audioplayers: ^5.2.1
  file_picker: ^8.0.0  # Hoặc phiên bản mới nhất
  url_launcher: ^6.2.5 # Để mở link tải file
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# SỬA LẠI: Cấu hình để tạo biểu tượng tròn (Adaptive Icon)
flutter_launcher_icons:
  android: true # Bật cho Android
  ios: false # Tắt cho iOS
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D47A1" # Màu nền xanh đậm cho biểu tượng
  adaptive_icon_foreground: "assets/logo.png" # Logo của bạn sẽ được đặt lên trên nền này

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/lottie/